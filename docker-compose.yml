services:
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp-ordering-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload_dev_password
      POSTGRES_DB: whatsapp_ordering
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
